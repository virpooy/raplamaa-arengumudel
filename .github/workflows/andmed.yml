# Andmete automaatne uuendamine.
# Iga kuu pärib Statistikaametist värsked andmed (pop = rahvastik, ext = lisaandmed), kontrollib neid ja:
#   - muutusi ei ole                       -> midagi ei juhtu
#   - vead (puuduvad väärtused, summad)    -> andmeid ei rakendata, avatakse teade (issue)
#   - muutused + hoiatused (uus aasta, Statistikaamet täpsustas vanu väärtusi)
#                                          -> muudatus läheb eraldi harusse ülevaatamiseks, avatakse teade
#   - muutused ilma hoiatusteta, leht töötab -> avaldatakse kohe (commit main-i, GitHub Pages uuendab lehe)
# NB: vahele jäetud sammu väljund on tühi ja GitHubi võrdluses tühi == '0', seega kontrollime ka steps.<id>.outcome.
# Käsitsi käivitamine: Actions -> "Andmete uuendamine" -> Run workflow.
name: Andmete uuendamine

on:
  schedule:
    - cron: "23 4 5 * *"   # iga kuu 5. kuupäeval 04:23 UTC (06:23/07:23 Eesti aja järgi)
  workflow_dispatch:
    inputs:
      force_review:
        description: "Suuna muudatus alati ülevaatamisele (ära avalda otse)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: andmed
  cancel-in-progress: false

jobs:
  andmed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Päri andmed (Statistikaamet), kontrolli ja rakenda korras andmestikud
        id: upd
        run: |
          python3 tools/update.py pop ext
          cat pipeline/out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Vead andmetes -> teade, midagi ei avaldata
        if: steps.upd.outputs.nerr != '0'
        run: |
          gh issue create --title "Andmete uuendamine: andmetes on vigu ($(date +%F))" --body-file pipeline/out/summary.md
          exit 1

      - name: Ehita leht
        if: steps.upd.outputs.nerr == '0' && steps.upd.outputs.changed == 'true'
        run: python3 build.py

      - name: Paigalda Playwright
        if: steps.upd.outputs.nerr == '0' && steps.upd.outputs.changed == 'true'
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Väravatest (leht peab töötama)
        id: gate
        if: steps.upd.outputs.nerr == '0' && steps.upd.outputs.changed == 'true'
        run: |
          set +e
          python3 tests/t_gate.py | tee pipeline/out/gate.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Leht ei tööta uute andmetega -> teade
        if: steps.gate.outcome == 'success' && steps.gate.outputs.code == '1'
        run: |
          { cat pipeline/out/summary.md; echo; echo "### Väravatest ei läbinud"; echo '```'; tail -40 pipeline/out/gate.txt; echo '```'; } > pipeline/out/issue.md
          gh issue create --title "Andmete uuendamine: leht ei tööta uute andmetega ($(date +%F))" --body-file pipeline/out/issue.md
          exit 1

      - name: Salvesta (otse või ülevaatamiseks)
        if: steps.gate.outcome == 'success' && steps.gate.outputs.code == '0'
        run: |
          git config user.name "andmete-uuendus[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json index.html
          MSG="Andmed uuendatud Statistikaametist: ${{ steps.upd.outputs.changed_list }} ($(date +%F))"
          if [ "${{ steps.upd.outputs.nwarn }}" = "0" ] && [ "${{ inputs.force_review }}" != "true" ]; then
            git commit -m "$MSG" -m "$(cat pipeline/out/summary.md)"
            git push origin HEAD:main
            echo "Avaldatud otse." >> "$GITHUB_STEP_SUMMARY"
          else
            BR="andmeuuendus/$(date +%Y%m%d)"
            git switch -c "$BR"
            git commit -m "$MSG, vajab ülevaatust" -m "$(cat pipeline/out/summary.md)"
            git push -f origin "$BR"
            { cat pipeline/out/summary.md; echo; echo "Muudatus on harus \`$BR\`: https://github.com/${{ github.repository }}/compare/main...$BR"; echo; echo "Leht töötab uute andmetega (väravatest läbis). Kui kõik on korras, ühenda haru main-iga."; } > pipeline/out/issue.md
            gh issue create --title "Andmete uuendamine vajab ülevaatust ($(date +%F))" --body-file pipeline/out/issue.md
          fi

      - name: Mõne andmestiku pärimine ebaõnnestus
        if: always() && steps.upd.outputs.failed != ''
        run: |
          echo "Pärimine ebaõnnestus: ${{ steps.upd.outputs.failed }}. Need andmed jäid muutmata."
          exit 1
