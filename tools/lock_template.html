<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Raplamaa arengukangas</title>
<style>
:root{--bg:#13152B;--bg2:#1B1E3A;--ink:#F3EFE4;--mut:#A9ABC6;--line:#2D3158;--acc:#F2C94C;--err:#FF7D6D}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:16px}
form{width:min(380px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px;letter-spacing:-.01em;display:flex;gap:10px;align-items:center}
p{margin:0;color:var(--mut);font-size:13.5px}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
.rem{flex-direction:row;align-items:center;gap:8px}
button{font:600 15px inherit;font-family:inherit;color:var(--bg);background:var(--acc);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;font-size:13px;color:var(--err)}
#msg.ok{color:var(--mut)}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="on">
  <h1><svg width="26" height="26" viewBox="0 0 38 38" aria-hidden="true"><path d="M19 2L36 19L19 36L2 19Z" fill="none" stroke="#F2C94C" stroke-width="1.6"/><path d="M19 9L29 19L19 29L9 19Z" fill="#F2C94C" fill-opacity=".18" stroke="#F2C94C"/></svg>Raplamaa arengukangas</h1>
  <p>Leht on salasõnaga kaitstud.</p>
  <input type="text" name="username" value="arengukangas" autocomplete="username" hidden>
  <label>Salasõna<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
  <label class="rem"><input type="checkbox" id="rem"> Jäta selles seadmes meelde</label>
  <button id="go" type="submit">Ava</button>
  <div id="msg" role="status" aria-live="polite"></div>
</form>
</main>
<script id="payload" type="application/octet-stream">@PAYLOAD@</script>
<script>
(function(){
const BOX=/*@BOX*/null;const KEY="arengukangas-lukk-v1";
const S=crypto.subtle,u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const msg=(t,ok)=>{const m=document.getElementById("msg");m.textContent=t;m.className=ok?"ok":"";};
async function privFromPw(pw){
  const base=await S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await S.deriveKey({name:"PBKDF2",salt:u8(BOX.kdf.salt),iterations:BOX.kdf.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await S.decrypt({name:"AES-GCM",iv:u8(BOX.priv.iv)},k,u8(BOX.priv.ct)));
}
async function open(pkcs8){
  const priv=await S.importKey("pkcs8",pkcs8,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  const raw=await S.decrypt({name:"RSA-OAEP"},priv,u8(BOX.wk));
  const K=await S.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const gz=await S.decrypt({name:"AES-GCM",iv:u8(BOX.iv)},K,u8(document.getElementById("payload").textContent.trim()));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
// meelde jäetud võti (kui on ja kehtib)
let saved=null;try{if(location.hash==="#unusta"){localStorage.removeItem(KEY);history.replaceState(null,"",location.pathname);msg("Seade on unustatud. Järgmisel korral küsitakse salasõna.",true);}saved=localStorage.getItem(KEY);}catch(e){}
if(saved){msg("Avan…",true);open(u8(saved)).catch(()=>{try{localStorage.removeItem(KEY);}catch(e){}msg("");});}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("go");b.disabled=true;msg("Kontrollin…",true);
  let pk;
  try{pk=await privFromPw(document.getElementById("pw").value);}
  catch(e){b.disabled=false;msg("Vale salasõna.");document.getElementById("pw").select();return;}
  if(document.getElementById("rem").checked){try{let s="";pk.forEach(c=>s+=String.fromCharCode(c));localStorage.setItem(KEY,btoa(s));}catch(e){}}
  try{msg("Avan…",true);await open(pk);}catch(e){b.disabled=false;msg("Lehe avamine ebaõnnestus: "+e.message);}
});
})();
</script>
</body>
</html>
